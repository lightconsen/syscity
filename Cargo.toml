[package]
name = "syscity"
version = "0.3.2"
edition = "2021"
rust-version = "1.94"
authors = ["Syscity Contributors"]
description = "Syscity - A Rust application"
license = "Apache-2.0"
repository = "https://github.com/lightconsen/syscity"

[lints.rust]
# Treat warnings as errors in CI (also passed via -D warnings on CLI).
# unsafe_code is already denied at crate level.
#
# Note: `unused_results` was evaluated and rejected — it flagged ~1040 sites,
# the vast majority being builder chains (Command::arg, HeaderMap::insert,
# HashMap::insert returning the old value) where ignoring the result is the
# intended idiom. The high-signal cases (dropped JoinHandle / Future / sqlx
# Query) are covered more precisely by the clippy lints below.

[lints.clippy]
# --- Correctness / error handling ---
# These are enabled as `warn` first to avoid blocking the build while the
# legacy codebase is cleaned up. Switch to `deny` once green.
# Temporarily allow: many legacy functions have no await statements.
unused_async = "allow"

# Avoid `.unwrap()` / `.expect()` in production code.
# Now enforced at deny level after cleanup pass — call sites that genuinely
# need them must add a localized `#[allow(...)]` with a justification comment.
unwrap_used = "deny"
expect_used = "deny"

# Avoid silent `.ok()` on Results.
result_unit_err = "warn"

# Catch silently-dropped values that almost always indicate a bug.
#
# `let_underscore_future` is enforced at `deny` — currently 0 violations.
# This catches the genuinely scary case: `let _ = some_async_fn()` (a
# forgotten `.await` — the future is dropped without running).
#
# `let_underscore_must_use` was evaluated and left at `allow`:
# 194 call sites would trip it, and a manual audit found the vast majority
# are intentional fire-and-forget (idempotent sqlx migrations whose error
# is expected, Discord `channel.say(...)` notifications, `OnceCell::set`
# for one-shot init). Forcing each to add `#[allow(...)]` would add noise
# without finding bugs. Re-enable if a future bug points to this pattern.
let_underscore_must_use = "allow"
let_underscore_future = "deny"

# --- Async / concurrency ---
# Help catch lock-across-await and unneeded async.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

# --- Maintainability ---
# Temporarily disabled because legacy code has many functions above the
# threshold. Re-enable once refactored.
cognitive_complexity = "allow"

# --- Nursery / pedantic lints we want to enforce over time ---
# These are intentionally warn-only while the codebase is being cleaned up.
[workspace]
members = ["crates/*", "desktop"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
rustyline = { version = "14.0", default-features = false }
dialoguer = { version = "0.11", default-features = false, features = ["password"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Configuration
config = "0.14"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "blocking", "multipart"], default-features = false }
bytes = "1.5"

# HTTP server
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "limit"] }

# WebSocket client
tokio-tungstenite = "0.24"

# JSON
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
dirs = "6.0"

# YAML support
serde_yml = "0.0.13"

# Async trait support
async-trait = "0.1"

# Futures for streaming
futures = "0.3"
async-stream = "0.3"

# Random number generation for jitter
rand = "0.8"

# Cron expression parsing
cron = "0.14"

# Glob patterns
glob = "0.3"

# URL encoding
urlencoding = "2.1"

# OAuth2
oauth2 = { version = "5.0", features = ["reqwest"] }

# Regex for security scanning
regex = "1.10"

# IP network parsing for trusted proxy CIDR matching
ipnet = "2.9"

# System monitoring (CPU, memory, disk, network, processes)
sysinfo = "0.30"

# Browser automation (optional)
chromiumoxide = { version = "0.9", optional = true }
url = "2.5"
sourcemap = { version = "9", optional = true }

# Shell expansion for paths
shellexpand = "3.1"

# LRU cache for session caching
lru = "0.18"

# Concurrent hashmap for rate limiter
dashmap = "6.0"

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
sha1 = { version = "0.10", optional = true }
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }
subtle = "2.5"

# WeChat Official Account (wechatmp) encrypted-message protocol
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
roxmltree = { version = "0.21", optional = true }

# Secure secret handling
zeroize = { version = "1.7", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }

# Encrypted file-store fallback (AES-256-GCM)
aes-gcm = "0.10"
flate2 = "1.1.9"
zip = "2"
tar = "0.4"

# Self-update staging (download into temp dir before atomic rename)
tempfile = "3.10"

# Audio capture (cross-platform I/O)
cpal = "0.15"

# Embed frontend assets into binary for single-file distribution (optional)
rust-embed = { version = "8", optional = true }
pdf-extract = "0.7"

# Office document generation (canvas-HTML → OOXML converters)
ppt-rs = "0.2"
docx-rs = "0.4"
rust_xlsxwriter = "0.99"
scraper = "0.27"

# SVG rasterization
resvg = "0.48"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }

# Vector database
pgvector = { version = "0.4", optional = true, features = ["sqlx"] }
libsqlite3-sys = { version = "0.30.1", optional = true }
sqlite-vec = { version = "0.1", optional = true }

# Embeddings (using API-based providers for now)
# fastembed has dependency issues with ort crate
# llama-cpp-2 for full GGUF support
llama-cpp-2 = { version = "0.1", optional = true }
# HuggingFace Hub for model auto-download
hf-hub = { version = "0.5", optional = true, features = ["tokio"] }

# Plugin system (WASM runtime)
wasmtime = { version = "46.0", optional = true }
wasmtime-wasi = { version = "46.0", optional = true }

# Hot reload - file watching
notify-debouncer-full = { version = "0.3", optional = true }

# Vision (OCR + UI element detection via ONNX)
ort = { version = "2.0.0-rc.12", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
ndarray = { version = "0.17", optional = true }

# QR code generation for device pairing
qrcode = "0.14"

# Terminal UI (optional)
ratatui = { version = "0.29" }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-util = { version = "0.7" }
unicode-width = { version = "0.2" }

# Channels (optional)
teloxide = { version = "0.17", features = ["macros"], optional = true }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"], optional = true }

# System resource limits and signals (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["signal", "process", "socket"] }

# Landlock kernel write fence (Linux filesystem MAC; pre_exec `restrict_self`)
# Landlock crate is Linux-only and never built on other platforms.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# Windows AppContainer write fence (win_appcontainer.rs). Pinned to the
# version already in the lock file; never built on non-Windows targets.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Isolation", "Win32_Storage_FileSystem",
  "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading",
] }

[features]
default = ["telegram", "discord", "slack", "whatsapp", "qq", "feishu", "signal", "imessage", "webchat", "wechatmp", "plugins", "hot-reload", "local-embeddings", "browser", "vision", "sqlite-vec"]
telegram = ["teloxide"]
discord = ["serenity"]
slack = []
whatsapp = []
qq = []
feishu = []
signal = []
imessage = []
webchat = []
wechatmp = ["dep:aes", "dep:cbc", "dep:sha1", "dep:roxmltree"]
all-channels = ["telegram", "discord", "slack", "whatsapp", "qq", "feishu", "signal", "imessage", "webchat", "wechatmp"]
web = []
# Syscity Cloud integration (login + cloud LLM/search/KB/connectors). Default
# OFF: default builds contain no cloud coupling (§2.7) — a default `cargo
# build` IS the "nocloud" build; compile it in with `--features cloud`
# (release binaries use `--all-features`). Cloud-compiled binaries default
# `cloud.enabled=on` at runtime; turn that off per-launch with
# `syscity start --nocloud`, `SYSCITY_CLOUD_ENABLED=0`, or config.toml
# `[cloud] enabled = false`.
cloud = []
browser = ["chromiumoxide", "sourcemap"]
local-embeddings = ["llama-cpp-2", "hf-hub"]
plugins = ["wasmtime", "wasmtime-wasi"]
hot-reload = ["notify-debouncer-full"]
vision = ["ort", "image", "ndarray"]
pgvector = ["dep:pgvector", "pgvector/sqlx", "sqlx/postgres"]
sqlite-vec = ["dep:sqlite-vec", "dep:libsqlite3-sys"]
embedded-assets = ["dep:rust-embed"]
# OS keyring backend — opt-in. Default builds use the 0600 encrypted file
# store only and never touch the platform keychain. Enable for the previous
# keyring-primary-with-file-fallback routing.
keyring = ["dep:keyring"]

# Intel macOS (x86_64-apple-darwin) profile — default features minus `vision`,
# plus `cloud` (release artifacts ship cloud; matches release.yml's
# `--all-features` builds on the other targets).
# ort (ONNX Runtime) ships no prebuilt library for this target and compiling it
# from source in CI is not viable, so the ONNX-based OCR/UI detection feature is
# dropped rather than blocking the whole Intel Mac build.
# Build with: cargo build --no-default-features --features intel-macos
intel-macos = [
    "cloud", "telegram", "discord", "slack", "whatsapp", "qq", "feishu",
    "signal", "imessage", "webchat", "wechatmp", "plugins", "hot-reload",
    "local-embeddings", "browser", "sqlite-vec",
]

# Mobile profile (Android/iOS) — pruned, sandbox-safe feature set.
# Build with: cargo build --no-default-features --features mobile
# Excludes the desktop-shaped defaults (channels, local-embeddings, vision,
# browser, hot-reload, keyring). SQLite is bundled because Android/iOS have
# no linkable system libsqlite3; `libsqlite3-sys/bundled` covers both sqlx
# and sqlite-vec via feature unification. `plugins` doubles as the wasmtime
# cross-compile canary; `embedded-assets` compiles the SPA into the binary
# (no dist/ filesystem path exists inside a mobile app bundle).
mobile = [
    "webchat",
    "plugins",
    "embedded-assets",
    "sqlite-vec",
    "libsqlite3-sys/bundled",
]

# Note: Discord and Slack use reqwest for HTTP API calls
# WhatsApp, QQ, Lark use reqwest with custom implementations
# Browser automation requires Chrome/Chromium installed

[dev-dependencies]
# Testing
wiremock = "0.6"
futures-util = "0.3"
# Read-back verification of generated xlsx in converter tests
calamine = "0.36"

# Concurrency control for tests
serial_test = "3.0"

# Snapshot testing (like Vitest snapshots)
insta = { version = "1.39", features = ["yaml", "json"] }

# Benchmark framework
criterion = { version = "0.5", features = ["html_reports"] }

# Browser automation for E2E tests
chromiumoxide = { version = "0.9" }

[[bench]]
name = "message_routing"
harness = false

[[bench]]
name = "serialization"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
