name: Signing Check

# Cheap proof that the Apple credentials in this repo's secrets still work:
# import the Developer ID .p12 into a throwaway keychain, sign a trivial
# Mach-O with the hardened runtime, and have Apple notarize it.
#
# Run this after rotating APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY /
# APPLE_API_* — before cutting a release. It takes a few minutes instead of
# the ~2 hours the full release pipeline needs, and it catches the failure
# modes that are otherwise only visible at the end of a macOS release job:
# a wrong keychain password, an identity string that does not match the cert,
# a missing private key in the .p12, or dead notarytool credentials.
#
# It signs a hello-world binary, not a syscity build: the question is whether
# the credentials work, and building the real binary here would only make the
# answer slower to arrive.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-check:
    name: Sign + notarize a test binary
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Prepare Apple signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          printf '%s' "$APPLE_CERTIFICATE" \
            | openssl base64 -d -A -out "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user \
            -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Name the identity that was actually imported: when this line and
          # APPLE_SIGNING_IDENTITY disagree, the sign step below fails with a
          # bare "no identity found" that says nothing about why.
          echo "== imported identities =="
          security find-identity -v -p codesigning

          P8="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" \
            | openssl base64 -d -A -out "$P8"
          chmod 600 "$P8"
          echo "APPLE_API_KEY_PATH=$P8" >> "$GITHUB_ENV"

      - name: Sign the test binary
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          uname -m
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/hello.c"
          clang -o "$RUNNER_TEMP/hello" "$RUNNER_TEMP/hello.c"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/hello"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/hello"
          codesign -dv --verbose=4 "$RUNNER_TEMP/hello" 2>&1 \
            | grep -E '^(Authority|TeamIdentifier|Timestamp|CodeDirectory)='

      - name: Notarize the test binary
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/hello.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/hello" "$ZIP"
          RESULT="$RUNNER_TEMP/notarytool.json"
          xcrun notarytool submit "$ZIP" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RESULT"
          cat "$RESULT"
          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RESULT")"
          [ "$STATUS" = "Accepted" ] || {
            echo "::error::notarization status: $STATUS"; exit 1; }
          echo "OK: signature and notarization accepted"
