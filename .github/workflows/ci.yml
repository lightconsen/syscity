name: CI

on:
  push:
    # `main` only, because this is a one-person project and the work lands
    # directly on `main`. There is no integration branch to keep quiet, and
    # Actions minutes on a public repository are free, so the earlier idea of
    # a `develop` scratch branch bought nothing: it only parked unverified
    # commits until someone opened a pull request.
    #
    # What the workflow has to protect is narrower: **do not push a `v*` tag
    # until the CI run for the commit it points at is green.** The release
    # pipeline builds artifacts from that tag, and a red main plus a tag is
    # how the v0.3.13 cycle burned three release runs.
    #
    # `pull_request` stays, because Dependabot delivers its updates as pull
    # requests and those want a gate before they merge.
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

# A push to a pull request branch supersedes the run in flight for that PR;
# without this, every `git push` during review buys another full matrix.
# Scoped by PR number (or ref for pushes) so separate PRs never cancel each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege. This repository is public and accepts pull requests from
# forks, so the default token must not be able to write anything: a compromised
# action or a poisoned dependency step would otherwise get a write-scoped
# GITHUB_TOKEN. No job here needs more than reading the checkout.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libasound2-dev libdbus-1-dev

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned toolchain (matches local dev) so CI clippy does not drift
          # onto newly-released lints between stable releases.
          toolchain: "1.97"
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Run static analysis
        run: |
          chmod +x scripts/static-analysis.sh
          ./scripts/static-analysis.sh

      - name: Run invariant-declaration check
        # The same rule static-analysis.sh --full enforces, run independently so
        # its gate cannot silently stop being exercised (--full is red today for
        # unrelated legacy patterns and CI runs plain static-analysis). A module
        # with neither registration nor a NONE marker fails the build.
        run: |
          chmod +x scripts/check-invariant-decls.sh
          ./scripts/check-invariant-decls.sh

      - name: Gate integrity checks
        run: |
          chmod +x scripts/gate-integrity.sh
          ./scripts/gate-integrity.sh --tree

      - name: Check build
        run: cargo check --all-features

      - name: Check docs build
        run: cargo doc --no-deps --all-features

  msrv:
    name: MSRV Consistency
    # This used to run `cargo check --all-features` on toolchain 1.97 — but so
    # does `check`, and 1.97 *is* the MSRV (`Cargo.toml` `rust-version`,
    # `rust-toolchain.toml`, and every job here all say 1.97). The job was
    # therefore a duplicate build, not an MSRV test.
    #
    # What is worth guarding is the property that made the old job look
    # meaningful: the three declarations agreeing. If one drifts, the CI
    # toolchain stops representing the MSRV, and no amount of compiling will
    # say so. This takes seconds instead of eight minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pinned toolchain, rust-version, and CI toolchain agree
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rust_version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          ci_version=$(sed -n 's/^ *toolchain: "\(.*\)"/\1/p' .github/workflows/ci.yml | sort -u | tr '\n' ' ')
          echo "rust-toolchain.toml channel : $toolchain"
          echo "Cargo.toml rust-version      : $rust_version"
          echo "CI toolchain: lines          : $ci_version"
          if [ "$toolchain" != "$rust_version" ]; then
            echo "::error::rust-toolchain.toml ($toolchain) and Cargo.toml rust-version ($rust_version) disagree"
            exit 1
          fi
          for v in $ci_version; do
            if [ "$v" != "$toolchain" ]; then
              echo "::error::CI uses toolchain $v but the project pins $toolchain"
              exit 1
            fi
          done

  windows-cross-check:
    name: Windows Cross Check
    runs-on: ubuntu-latest
    needs: check
    # Drafts skip the expensive half; the cheap jobs below still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure web assets directory exists
        run: mkdir -p dist

      # zig ships its own mingw-w64 sysroot, so no MinGW install is needed.
      # `scripts/cross/zig-cc-x86_64-windows-gnu` rewrites the Rust triple into
      # zig's spelling; `.cargo/config.toml` wires it up as this target's
      # linker and target-suffixed CC/AR.
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"
          targets: x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Until `windows` below was added, this was the only job that compiled
      # the `cfg(target_os = "windows")` modules under the `gnu` target. The
      # release pipeline builds Windows natively, but only when a `v*` tag is
      # pushed, which is the worst moment to discover a Windows-only break;
      # the native job now covers the `msvc` target on every run.
      #
      # The feature set is deliberately not `--all-features`: `vision` (ort)
      # publishes no prebuilt library for `x86_64-pc-windows-gnu`, and
      # `local-embeddings` (llama-cpp-2) needs mingw headers bindgen is not
      # pointed at. Neither is needed to compile the Windows modules.
      - name: Check the Windows target
        run: |
          cargo check --target x86_64-pc-windows-gnu --lib \
            --no-default-features \
            --features "simplex,sqlite-vec,plugins,browser"

  windows:
    name: Windows Check
    # The `gnu` cross-check above proves the Windows modules compile against
    # mingw, but it cannot link, cannot use `ort` (no prebuilt for that
    # target) and never runs a Windows toolchain. This job is the real MSVC
    # target, on a Windows host — the same target the release pipeline ships.
    #
    # `--all-features` to match the Linux `Check` job. That pulls llama-cpp-2,
    # which is the slow part; if this job's wall clock ever needs cutting,
    # drop `local-embeddings` first — it has nothing to do with Windows.
    runs-on: windows-latest
    needs: check
    # Drafts skip the expensive half; the cheap jobs below still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `--all-features` enables `embedded-assets`, which rust-embeds `dist/`
      # at compile time; the directory must exist even though nothing builds
      # the frontend here.
      - name: Ensure web assets directory exists
        run: New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check
        run: cargo check --all-features

  release-link:
    name: Release Link (macOS)
    # Every other job runs `cargo check`, which stops at metadata — nothing in
    # CI ever produced a linked release binary. That is how the
    # `___isPlatformVersionAtLeast` failure (ort's prebuilt CoreML objects
    # meeting the release profile's `lto = true` + `-dead_strip`) reached a
    # local `cargo build --release` unnoticed; see build.rs.
    #
    # A cold macOS release build is roughly 40 minutes, so this runs on pushes
    # rather than on every pull request. The `vision` feature is required (it
    # is what links ort); `local-embeddings` is left out because llama-cpp-2's
    # C++ build is the slowest part and has nothing to do with the link.
    # Verified locally that this exact feature set still reproduces the
    # original link error on a tree without the build.rs fix.
    if: github.event_name == 'push'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system build dependencies
        run: brew install protobuf

      - name: Ensure web assets directory exists
        run: mkdir -p dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Link the release binary
        run: |
          cargo build --release --bin syscity \
            --no-default-features \
            --features "simplex,sqlite-vec,plugins,browser,vision"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    # Drafts skip the expensive half; the cheap jobs below still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libasound2-dev libdbus-1-dev

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify python3 (for MCP E2E tests)
        run: python3 --version

      - name: Test the benchmark glue
        # Pure Python, no VM, no model: the syscity binary is stubbed. Guards
        # the replay contract that `bench run`'s `actions` field feeds.
        run: python3 bench/osworld/test_sycity_agent.py

      - name: Run tests
        run: "cargo test --all-features -- --skip e2e:: --nocapture"

      - name: Run E2E tests (mock + no-provider)
        # The chat journeys fall back to the mock provider when none is
        # configured, so they run here. `browser_chat_tests` is skipped on
        # purpose: it needs a real Chrome and self-skips without one, which
        # would report green without running anything.
        run: |
          cargo test --test e2e_test -- \
            --skip browser_chat_tests \
            --test-threads=1

      - name: Run doc tests
        run: cargo test --doc --all-features

  test-local-embeddings:
    name: Test local-embeddings feature
    runs-on: ubuntu-latest
    needs: check
    # Drafts skip the expensive half; the cheap jobs below still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake protobuf-compiler pkg-config libasound2-dev libdbus-1-dev

      - name: Ensure web assets directory exists
        run: mkdir -p dist

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build frontend
        # web_ui handler tests read real assets from dist/, so the job must
        # build the frontend just like the Test / Test (macOS) / Code Coverage
        # jobs do; otherwise asset lookups fall through and the found-path
        # assertions fail.
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run local-embeddings tests
        run: "cargo test --features local-embeddings -- --skip e2e::"

  test-macos:
    name: Test (macOS)
    # Post-merge only. At GitHub's macOS rate this job alone is ~$4.6 per run —
    # roughly four times the entire Linux matrix — and it was the single
    # largest line in the metered usage. Pull requests are therefore gated by
    # the Linux and Windows jobs; the macOS-only code (Seatbelt, the macOS
    # platform modules) is verified on `main` instead.
    #
    # The trade: a macOS-only break now lands on `main` rather than on the
    # pull request. Move this back to pull requests if that ever costs more
    # than the minutes it saves.
    if: github.event_name == 'push'
    runs-on: macos-latest
    needs: check
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system build dependencies
        run: brew install protobuf

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run tests
        run: "cargo test --all-features -- --skip e2e:: --nocapture"

  build:
    name: Build
    # The one combination nothing else covers: **default** features on Linux.
    # `check` compiles all-features on Ubuntu, `windows` does the same on
    # Windows, and `test-macos` does it on macOS after a merge.
    #
    # The macOS arm was dropped here rather than kept as a default-features
    # compile check: at $0.062/min it cost about $0.50 per run — ~$69 a month
    # — to re-verify a feature set `test-macos` already covers on `main`.
    runs-on: ubuntu-latest
    needs: check
    # Drafts skip the expensive half; the cheap jobs below still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libasound2-dev libdbus-1-dev

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check
        run: cargo check

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm run build

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run cargo audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1

      - name: Install cargo-deny
        uses: taiki-e/install-action@63300d694c674b6bd0e1ca77d202a2bc41c4b623 # cargo-deny
        with:
          tool: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

      # Everything above reads Cargo.lock. The pnpm workspaces are a second
      # supply chain with a second advisory feed, and this job is the backstop
      # for a commit that bypassed the local hook — `--no-verify`, or a clone
      # that never ran `git config core.hooksPath .githooks`.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Audit the JS workspaces
        run: ./scripts/audit.sh --js

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: check
    # Drafts skip the expensive half; the cheap jobs below still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libasound2-dev libdbus-1-dev

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c3076e6fa5aeb9a93daf1bd8eff73345250a8a9c # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        # Source-based coverage via llvm-cov. tarpaulin's ptrace instrumentation
        # segfaulted non-deterministically (the crash point drifted across runs:
        # skill-manager, screenshot-encoder, system, use_loop), so it was
        # replaced; the accumulated tarpaulin-era test skips are dropped — every
        # test that runs in the normal suite runs here too. e2e:: is skipped
        # for the same reason the Test job skips it (spawns gateway processes,
        # slow/flaky under CI). The 55% gate matches the measured llvm-cov
        # baseline (~56.3% locally); ratchet it up as coverage improves —
        # tarpaulin's old fail-under=80 was aspirational and never met.
        # syscity-desktop is excluded: its Tauri/glib build needs GTK system
        # libraries that CI doesn't install, and it has no tests anyway.
        run: "cargo llvm-cov --workspace --exclude syscity-desktop --all-features --lcov --output-path lcov.info --fail-under-lines 55 --ignore-filename-regex '(^|/)(tests|target)/' -- --skip e2e::"

      # A failing threshold used to print nothing but "exit code 1" — the
      # percentage it compared against was the one thing the log omitted, so a
      # red gate could not be acted on without reproducing the whole run. The
      # coverage data is still on disk at this point, so reporting it costs
      # seconds.
      - name: Coverage summary
        if: always()
        run: |
          cargo llvm-cov report --text \
            --ignore-filename-regex '(^|/)(tests|target)/' | tail -30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./lcov.info
          fail_ci_if_error: false
          verbose: true

  plugin-boundary:
    name: Plugin SDK Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check plugin SDK boundary
        run: |
          chmod +x scripts/check-plugin-boundary.sh
          SYSCITY_PLUGIN_DIRS="./plugins" ./scripts/check-plugin-boundary.sh
