name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

# Allow one deployment at a time; older runs are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Build site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # The site links to curl -sSL https://syscity.net/install.sh | bash and
          # irm https://syscity.net/install.ps1 | iex. GitHub Pages serves the
          # artifact root verbatim, so bake the one-line installers (canonical
          # copies live in scripts/) into dist/ to satisfy those URLs.
          cp ../scripts/install.sh dist/install.sh
          cp ../scripts/install.ps1 dist/install.ps1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
