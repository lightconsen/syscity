name: Agent Nightly

# One queued issue → one reviewed PR, every night.
#
# Picks the oldest open issue labeled `agent:ready`, runs a headless coding
# agent to implement it on a branch, verifies the change with
# ./scripts/agent-verify.sh, and opens a PR for a human to review and merge.
# The agent never pushes to main and never merges.
#
# Required configuration:
#   secrets.EVAL_API_KEY — DeepSeek key, used as the agent credential over
#                          DeepSeek's Anthropic-compatible endpoint
#   secrets.AGENT_PAT    — OPTIONAL fine-grained PAT with Pull requests
#                          (read and write) and read access to the repo. Used
#                          only to open the PR, so that ci.yml runs on it; the
#                          branch push and every issue call use GITHUB_TOKEN.
#                          Without it the PR is opened by GITHUB_TOKEN and CI
#                          must be re-run by hand.
# Optional variables (override the defaults in `env`):
#   vars.AGENT_ANTHROPIC_BASE_URL, vars.AGENT_MODEL, vars.AGENT_HAIKU_MODEL
#
# Labels (created on demand): agent:ready, agent:in-progress, agent:review,
# agent:blocked, agent-pr. See docs/agent-loop.md.

on:
  schedule:
    - cron: '47 18 * * *' # 02:47 Beijing time, off the :00/:30 rush
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to work on (blank = oldest agent:ready)'
        default: ''
      dry_run:
        description: 'Select and prepare only; do not run the agent or open a PR'
        type: boolean
        default: false

# Never two agent runs at once: a second run would race the first for the same
# issue and the same branch.
concurrency:
  group: agent-nightly
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  # Issue and label operations use the workflow's own token, which carries
  # `issues: write` from the `permissions:` block above. This keeps those very
  # common calls off the PAT, so the PAT only needs Contents + Pull requests.
  GH_TOKEN: ${{ github.token }}
  # Pushing a branch and opening the PR use the PAT when present — a PR opened
  # by GITHUB_TOKEN does not trigger ci.yml (GitHub suppresses that by design).
  PAT_TOKEN: ${{ secrets.AGENT_PAT || github.token }}
  # The agent runs on the same provider as the eval harness — DeepSeek, over its
  # Anthropic-compatible endpoint (the wire format `claude` speaks). Endpoint and
  # model are overridable with repository variables so they can be pinned
  # without editing this file.
  ANTHROPIC_BASE_URL: ${{ vars.AGENT_ANTHROPIC_BASE_URL || 'https://api.deepseek.com/anthropic' }}
  ANTHROPIC_AUTH_TOKEN: ${{ secrets.EVAL_API_KEY }}
  ANTHROPIC_MODEL: ${{ vars.AGENT_MODEL || 'deepseek-v4-pro[1m]' }}
  ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ vars.AGENT_MODEL || 'deepseek-v4-pro[1m]' }}
  ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ vars.AGENT_MODEL || 'deepseek-v4-pro[1m]' }}
  # On a gateway credential, background tasks run on the main model unless the
  # Haiku slot is pinned, so pin it (this is the cheaper flash tier).
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ vars.AGENT_HAIKU_MODEL || 'deepseek-v4-flash' }}
  CLAUDE_CODE_SUBAGENT_MODEL: ${{ vars.AGENT_HAIKU_MODEL || 'deepseek-v4-flash' }}
  # Bound the post-turn idle wait for background tasks (the CLI otherwise waits
  # up to ten minutes) so the job cannot hang.
  CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: '120000'
  # At most this many agent PRs may be open at once. One task per night keeps
  # both the review load and the API spend bounded.
  MAX_OPEN_AGENT_PRS: '1'
  # Client-side cost ceiling passed to the CLI (an estimate, so leave headroom).
  AGENT_MAX_BUDGET_USD: '5'

jobs:
  agent:
    name: One queued issue → PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Default token: the branch push below needs only `contents: write`,
          # which this workflow already declares. The PAT is reserved for
          # opening the PR (see Publish), which is the one call that must not
          # come from GITHUB_TOKEN.
          fetch-depth: 0

      - name: Ensure labels exist
        run: |
          set -euo pipefail
          # `gh issue list --label` and `gh issue edit --add-label` both fail on
          # an unknown label, so create the set up front. Idempotent.
          gh label create "agent:ready"       --color 0E8A16 --description "Queued for the nightly agent"      2>/dev/null || true
          gh label create "agent:in-progress" --color FBCA04 --description "Claimed by a running agent"        2>/dev/null || true
          gh label create "agent:review"      --color 1D76DB --description "Agent opened a PR"                 2>/dev/null || true
          gh label create "agent:blocked"     --color B60205 --description "Agent could not verify a change"    2>/dev/null || true
          gh label create "agent-pr"          --color 5319E7 --description "Opened by the nightly agent"       2>/dev/null || true

      - name: Select one task
        id: select
        env:
          ISSUE_INPUT: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          open=$(gh pr list --label agent-pr --state open --json number --jq 'length')
          if [ "$open" -ge "$MAX_OPEN_AGENT_PRS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${open} agent PR(s) already open (cap ${MAX_OPEN_AGENT_PRS}); skipping."
            exit 0
          fi
          if [ -n "${ISSUE_INPUT:-}" ]; then
            num="$ISSUE_INPUT"
          else
            num=$(gh issue list --label agent:ready --state open --limit 100 \
                    --json number --jq 'sort_by(.number) | .[0].number // empty')
          fi
          if [ -z "$num" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::No agent:ready issues queued; nothing to do."
            exit 0
          fi
          title=$(gh issue view "$num" --json title --jq .title)
          echo "number=$num" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "::notice::Selected issue #${num}: ${title}"

      - name: Claim the issue
        # Not on a dry run: claiming (label + comment) is a side effect, and a
        # dry run is meant to show what *would* happen without changing anything.
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          gh issue edit "${{ steps.select.outputs.number }}" \
            --add-label agent:in-progress --remove-label agent:ready
          gh issue comment "${{ steps.select.outputs.number }}" \
            --body "🤖 The nightly agent picked this up (run ${GITHUB_RUN_ID})."

      - name: Dry-run summary
        if: steps.select.outputs.skip != 'true' && inputs.dry_run == true
        run: |
          echo "::notice::DRY RUN — would work issue #${{ steps.select.outputs.number }}: ${{ steps.select.outputs.title }}"
          echo "No claim, no agent, no PR. Re-run without dry_run to actually work it."

      - name: Install system build dependencies
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev libasound2-dev libdbus-1-dev

      - name: Install Rust
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true
        uses: Swatinem/rust-cache@v2

      - name: Install the agent
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true
        run: npm i -g @anthropic-ai/claude-code

      - name: Prepare branch
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true
        id: branch
        run: |
          set -euo pipefail
          branch="agent/issue-${{ steps.select.outputs.number }}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Run the agent
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true
        # A crashed agent should still fall through to the reporting steps
        # rather than abort the job and leave the issue stuck in-progress.
        continue-on-error: true
        run: |
          set -euo pipefail
          num="${{ steps.select.outputs.number }}"
          title=$(gh issue view "$num" --json title --jq .title)
          body=$(gh issue view "$num" --json body --jq .body)
          {
            cat .github/agent-task-prompt.md
            printf '\n---\n\n# Issue #%s: %s\n\n%s\n' "$num" "$title" "$body"
          } | sed "s/#<issue-number>/#${num}/" > /tmp/task-prompt.md
          cat /tmp/task-prompt.md
          echo "::group::agent"
          claude -p "$(cat /tmp/task-prompt.md)" \
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(cargo *),Bash(./scripts/*),Bash(git add),Bash(git commit),Bash(git status),Bash(git diff)" \
            --disallowedTools "Bash(git push),Bash(git merge),Bash(git rebase),Bash(gh pr merge)" \
            --max-budget-usd "${AGENT_MAX_BUDGET_USD}" \
            2>&1 | tee agent-output.log
          echo "::endgroup::"

      - name: Verify
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true
        id: verify
        continue-on-error: true
        run: ./scripts/agent-verify.sh 2>&1 | tee agent-verify.log

      - name: Publish
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true && steps.verify.outcome == 'success'
        id: publish
        env:
          ISSUE_TITLE: ${{ steps.select.outputs.title }}
        run: |
          set -euo pipefail
          num="${{ steps.select.outputs.number }}"
          branch="${{ steps.branch.outputs.name }}"
          git config user.name "syscity-agent"
          git config user.email "syscity-agent@users.noreply.github.com"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -s -m "chore(agent): address #${num}"
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" = "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push -u origin "$branch"
          subject=$(git log -1 --pretty=%s)
          {
            echo "## Description"
            echo
            echo "Automated change for #${num}: ${ISSUE_TITLE}"
            echo
            echo "## Related Issue"
            echo
            echo "Closes #${num}"
            echo
            echo "## Checklist"
            echo
            echo "- [x] \`./scripts/agent-verify.sh\` passes (see the run log)"
            echo "- [ ] Reviewed by a human"
            echo
            echo "_Opened by the nightly agent loop. A human must review and merge._"
          } > /tmp/pr-body.md
          # Open the PR with the PAT so it triggers ci.yml (a PR opened by
          # GITHUB_TOKEN does not). If the PAT cannot create PRs, fall back to
          # GITHUB_TOKEN — the PR still lands, it just needs CI re-run by hand.
          if ! pr_url=$(GH_TOKEN="$PAT_TOKEN" gh pr create --base main --head "$branch" \
                --title "$subject" --body-file /tmp/pr-body.md 2>/tmp/pr-err); then
            echo "::warning::PR creation with AGENT_PAT failed; falling back to GITHUB_TOKEN."
            cat /tmp/pr-err
            pr_url=$(gh pr create --base main --head "$branch" \
              --title "$subject" --body-file /tmp/pr-body.md)
          fi
          echo "$pr_url"
          gh pr edit "$pr_url" --add-label agent-pr
          gh issue edit "$num" --add-label agent:review --remove-label agent:in-progress

      - name: Report a change that could not be verified
        if: steps.select.outputs.skip != 'true' && inputs.dry_run != true && steps.verify.outcome != 'success'
        run: |
          set -euo pipefail
          num="${{ steps.select.outputs.number }}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          tail -c 4000 agent-verify.log > /tmp/tail.log 2>/dev/null || echo "(no verify log)" > /tmp/tail.log
          gh issue edit "$num" --add-label agent:blocked --remove-label agent:in-progress
          {
            printf '%s\n' "🤖 The nightly agent produced a change that did not pass verification."
            printf '%s\n\n' "\`./scripts/agent-verify.sh\` failed:"
            printf '%s\n' "\`\`\`"
            cat /tmp/tail.log
            printf '\n%s\n\nRun: %s\n' "\`\`\`" "$run_url"
          } > /tmp/comment.md
          gh issue comment "$num" --body-file /tmp/comment.md

      - name: Report a change with nothing to publish
        if: steps.publish.outputs.changed == 'false'
        run: |
          num="${{ steps.select.outputs.number }}"
          gh issue edit "$num" --add-label agent:blocked --remove-label agent:in-progress
          gh issue comment "$num" --body "🤖 The nightly agent ran but produced no changes (the tree is identical to \`main\`). Needs a human."

      - name: Report an unexpected failure
        if: failure() && steps.select.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          num="${{ steps.select.outputs.number }}"
          gh issue edit "$num" --add-label agent:blocked --remove-label agent:in-progress || true
          gh issue comment "$num" --body "🤖 The nightly agent run failed before it could report a result. See the run log for details." || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-nightly-${{ github.run_number }}
          path: |
            agent-output.log
            agent-verify.log
          if-no-files-found: ignore
