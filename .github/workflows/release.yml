name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: syscity-linux-amd64
            cargo_args: --all-features
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: syscity-linux-arm64
            cargo_args: --all-features
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: syscity-macos-arm64
            cargo_args: --all-features
          # Intel macOS: ort (ONNX Runtime, used by `vision`) ships no prebuilt
          # binary for x86_64-apple-darwin, and compiling it from source in CI is
          # not viable. Build the `intel-macos` profile (default features minus
          # `vision`) so Intel Macs still get a binary, minus ONNX OCR/UI detection.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: syscity-macos-amd64
            cargo_args: --no-default-features --features intel-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler libasound2-dev libdbus-1-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_args }}
        env:
          # llama.cpp requires std::filesystem (macOS 10.15+). Cross-target builds
          # default the deployment target lower, so pin it on macOS builds.
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '10.15' || '' }}

      # Developer ID signing + notarization. The CLI is a bare Mach-O, so
      # notarytool needs it zipped and Apple cannot staple a ticket to it —
      # Gatekeeper validates the notarization online on first run.
      - name: Prepare Apple signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          # Developer ID cert + key into a throwaway keychain the ephemeral
          # runner discards with the job.
          printf '%s' "$APPLE_CERTIFICATE" \
            | openssl base64 -d -A -out "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          # codesign runs headless, so the imported key must be pre-authorized
          # or it blocks on a keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user \
            -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # App Store Connect API key for notarytool. Tauri reads APPLE_API_KEY
          # as the Key ID and APPLE_API_KEY_PATH as the .p8 path; notarytool is
          # told both explicitly.
          P8="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" \
            | openssl base64 -d -A -out "$P8"
          chmod 600 "$P8"
          echo "APPLE_API_KEY_PATH=$P8" >> "$GITHUB_ENV"

      - name: Sign release binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/syscity"
          codesign --force --options runtime --timestamp \
            --entitlements scripts/entitlements/cli.entitlements \
            --sign "$APPLE_SIGNING_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Notarize release binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/syscity"
          ZIP="$RUNNER_TEMP/${{ matrix.asset_name }}.zip"
          ditto -c -k --keepParent "$BIN" "$ZIP"

          RESULT="$RUNNER_TEMP/notarytool.json"
          if ! xcrun notarytool submit "$ZIP" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RESULT"; then
            cat "$RESULT" || true
            echo "::error::notarytool submission failed"
            exit 1
          fi
          cat "$RESULT"

          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RESULT")"
          if [ "$STATUS" != "Accepted" ]; then
            ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RESULT")"
            xcrun notarytool log "$ID" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" || true
            echo "::error::notarization status: $STATUS"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../${{ matrix.asset_name }}.tar.gz syscity
          cd -

      - name: Checksum
        shell: bash
        run: |
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ./${{ matrix.asset_name }}.tar.gz
            ./${{ matrix.asset_name }}.tar.gz.sha256

  build-desktop:
    name: Build Desktop Apps
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_prefix: syscity-desktop-linux-amd64
            updater_target: linux
            updater_arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_prefix: syscity-desktop-macos-arm64
            updater_target: darwin
            updater_arch: aarch64
          # Intel macOS desktop: syscity is built via the `intel-macos` profile
          # (default minus `vision`) — see the target table in desktop/Cargo.toml.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_prefix: syscity-desktop-macos-amd64
            updater_target: darwin
            updater_arch: x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_prefix: syscity-desktop-windows-amd64
            updater_target: windows
            updater_arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libdbus-1-dev protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      # The App Store Connect API key is the only piece Tauri cannot read from
      # a secret directly: APPLE_API_KEY_PATH must point at a real .p8 file.
      - name: Prepare Apple notary key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" \
            | openssl base64 -d -A -out "$P8"
          chmod 600 "$P8"
          echo "APPLE_API_KEY_PATH=$P8" >> "$GITHUB_ENV"

      - name: Build Tauri App
        working-directory: desktop
        run: cargo tauri build --target ${{ matrix.target }}
        env:
          # minisign signing key — set once in the repo secrets (see plan).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # llama.cpp requires std::filesystem (macOS 10.15+). cargo tauri build
          # defaults the deployment target lower, so pin it on macOS builds.
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '10.15' || '' }}
          # Apple Developer ID. Tauri creates its own keychain from the .p12,
          # signs the bundle with the hardened runtime, then notarizes and
          # staples it — no manual keychain step needed here. Apple-account
          # auth is deliberately the API-key form (not APPLE_ID/APPLE_PASSWORD),
          # which is the one that survives unattended CI. Ignored on non-macOS
          # targets.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Tauri notarizes only the .app. A quarantined .dmg is assessed on its own
      # ticket (`spctl -t open`: "rejected, source=Unnotarized Developer ID"), so
      # it must be notarized and stapled separately — the .dmg is what the
      # download page serves.
      - name: Notarize and staple the dmg
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/target/${{ matrix.target }}/release/bundle"
          [ -d "$BUNDLE_DIR" ] || BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"

          for DMG in "$BUNDLE_DIR"/dmg/*.dmg; do
            [ -f "$DMG" ] || continue
            RESULT="$RUNNER_TEMP/notarytool-dmg.json"
            xcrun notarytool submit "$DMG" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RESULT"
            cat "$RESULT"
            STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RESULT")"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::dmg notarization status: $STATUS"
              exit 1
            fi
            xcrun stapler staple "$DMG"
          done

      # Fail the release rather than publish a bundle Gatekeeper will reject.
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # desktop/ is a workspace member, so the bundle lands in one of two
          # places depending on how cargo resolves the target dir.
          BUNDLE_DIR="desktop/target/${{ matrix.target }}/release/bundle"
          [ -d "$BUNDLE_DIR" ] || BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"

          APP="$BUNDLE_DIR/macos/Syscity.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vvv -t exec "$APP"

          for DMG in "$BUNDLE_DIR"/dmg/*.dmg; do
            [ -f "$DMG" ] || continue
            codesign --verify --strict --verbose=2 "$DMG"
            xcrun stapler validate "$DMG"
            spctl -a -vvv -t open --context context:primary-signature "$DMG"
          done

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          # desktop/ is a workspace member, so `cargo tauri build` writes to
          # the WORKSPACE ROOT target dir, not desktop/target/. Try both.
          BUNDLE_DIR="desktop/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          fi
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::bundle directory not found (looked in desktop/target and target)"
            exit 1
          fi
          echo "Using bundle dir: $BUNDLE_DIR"
          OUTPUT_DIR="desktop-artifacts"
          mkdir -p "$OUTPUT_DIR"
          PREFIX="${{ matrix.asset_prefix }}"
          UPDATER_JSON="syscity-desktop-${{ matrix.updater_target }}-${{ matrix.updater_arch }}.json"
          UPDATER_BASE="https://github.com/lightconsen/syscity/releases/latest/download"

          # macOS
          for f in "$BUNDLE_DIR"/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.dmg"
          done

          # Windows
          for f in "$BUNDLE_DIR"/msi/*.msi; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.msi"
          done
          for f in "$BUNDLE_DIR"/nsis/*.exe; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.exe"
          done

          # Linux
          for f in "$BUNDLE_DIR"/deb/*.deb; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.deb"
          done
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.AppImage"
          done

          # Updater payload + signatures. The updater payload is the `.app.tar.gz`
          # on macOS and the installer (`.msi` / `.AppImage`) on other platforms;
          # the client verifies the signature embedded in the updater JSON, so the
          # standalone `.sig` files are published for completeness/debugging.
          for f in "$BUNDLE_DIR"/macos/*.app.tar.gz; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.app.tar.gz"
          done
          for f in "$BUNDLE_DIR"/macos/*.app.tar.gz.sig; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.app.tar.gz.sig"
          done
          for f in "$BUNDLE_DIR"/msi/*.msi.sig; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.msi.sig"
          done
          for f in "$BUNDLE_DIR"/nsis/*.exe.sig; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.exe.sig"
          done
          for f in "$BUNDLE_DIR"/appimage/*.AppImage.sig; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.AppImage.sig"
          done
          for f in "$BUNDLE_DIR"/deb/*.deb.sig; do
            [ -f "$f" ] && cp "$f" "$OUTPUT_DIR/$PREFIX.deb.sig"
          done

          # Tauri v2 does NOT write a latest.json — build the updater manifest
          # from scratch: version from the tag, signature from the payload's
          # .sig file, URL pointing at the release download. One JSON per
          # platform, published under the endpoint's placeholder name.
          python3 - "$OUTPUT_DIR" "$UPDATER_JSON" "$PREFIX" "$UPDATER_BASE" "${{ matrix.updater_target }}" "${{ matrix.updater_arch }}" <<'PY'
          import datetime, json, os, sys

          out_dir, updater_json, prefix, base, target, arch = sys.argv[1:]
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          payload = {
              "darwin": f"{prefix}.app.tar.gz",
              "linux": f"{prefix}.AppImage",
              "windows": f"{prefix}.exe",
          }[target]
          platform_key = f"{target}-{arch}"

          sig_file = os.path.join(out_dir, payload + ".sig")
          if not os.path.exists(sig_file):
              print(f"::error::missing updater signature {sig_file}")
              sys.exit(1)
          with open(sig_file) as fh:
              signature = fh.read().strip()

          manifest = {
              "version": version,
              "notes": "",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  platform_key: {
                      "signature": signature,
                      "url": f"{base}/{payload}",
                  }
              },
          }
          with open(os.path.join(out_dir, updater_json), "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(f"Wrote updater manifest {updater_json} for {platform_key}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_prefix }}
          path: desktop-artifacts/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Guard: a release without desktop bundles is worse than no release —
      # desktop artifact collection used to silently no-op (wrong bundle path),
      # shipping a CLI-only release with green jobs.
      - name: Verify artifact completeness
        shell: bash
        run: |
          set -euo pipefail
          for prefix in syscity-desktop-linux-amd64 syscity-desktop-macos-arm64 syscity-desktop-macos-amd64 syscity-desktop-windows-amd64; do
            if ! ls artifacts/ | grep -q "^${prefix}"; then
              echo "::error::missing desktop artifacts for ${prefix}"
              exit 1
            fi
          done
          for uj in syscity-desktop-linux-x86_64.json syscity-desktop-darwin-aarch64.json syscity-desktop-darwin-x86_64.json syscity-desktop-windows-x86_64.json; do
            if [ ! -f "artifacts/$uj" ]; then
              echo "::error::missing updater manifest $uj"
              exit 1
            fi
          done
          for prefix in syscity-linux-amd64 syscity-linux-arm64 syscity-macos-arm64 syscity-macos-amd64; do
            if ! ls artifacts/ | grep -q "^${prefix}\.tar\.gz$"; then
              echo "::error::missing CLI tarball for ${prefix}"
              exit 1
            fi
          done
          ls -la artifacts/

      # Release body comes from the CHANGELOG.md section matching the tag
      # (## [X.Y.Z]); without one, fall back to GitHub's generated notes.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ -s release_notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release_notes.md

      - name: Create Release (generated notes fallback)
        if: steps.notes.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      # Mirror every release artifact to Cloudflare R2 (bucket layout is flat)
      # so the marketing site can serve them at https://syscity.net/releases/<file>
      # via the worker in workers/releases/. Filenames are stable across tags
      # (latest semantics): sync overwrites in place and --delete prunes
      # artifacts dropped from the release.
      #
      # Required repo secrets:
      #   CLOUDFLARE_ACCOUNT_ID   — Cloudflare account ID
      #   R2_ACCESS_KEY_ID        — R2 API token access key
      #   R2_SECRET_ACCESS_KEY    — R2 API token secret
      #   (token scope: Object Read & Write on the `syscity-releases` bucket)
      - name: Publish to Cloudflare R2
        working-directory: artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws s3 sync . s3://syscity-releases/ \
            --endpoint-url "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --delete

