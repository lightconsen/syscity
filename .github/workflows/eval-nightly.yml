name: Eval Nightly

# Layer-2 eval: runs the ci_smoke suite against a live LLM every night.
# Non-blocking by design — a failure opens (or updates) a tracking issue
# instead of turning the repository red. LLM output is non-deterministic,
# so this signal is informational, not a merge gate.
#
# Required configuration:
#   secrets.EVAL_API_KEY     — API key for the configured provider
#                              (or provider-specific secrets below)
#   secrets.ANTHROPIC_API_KEY / secrets.OPENAI_API_KEY — env-var fallback
#   vars.EVAL_PROVIDER       — provider preset name (default: anthropic)
#   vars.EVAL_MODEL          — model override (default: provider preset)
#   vars.EVAL_BASE_URL       — custom/self-hosted endpoint (optional)
#   vars.EVAL_JUDGE_MODEL    — cheaper judge model, e.g. deepseek-v4-flash
#                              (default: same model as the agent)
#   secrets.TAVILY_API_KEY   — web_search provider for eval tasks (DuckDuckGo
#   (or BRAVE_API_KEY)         scraping is blocked on GitHub runner IPs)

on:
  schedule:
    - cron: '23 18 * * *' # 02:23 Beijing time, off the :00/:30 rush
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        default: 'ci_smoke'
      trials:
        description: 'Trials per task (0 = suite default)'
        default: '0'

permissions:
  issues: write # failure/recovery notifications

env:
  CARGO_TERM_COLOR: always
  EVAL_PROVIDER: ${{ vars.EVAL_PROVIDER || 'anthropic' }}
  EVAL_MODEL: ${{ vars.EVAL_MODEL || '' }}
  EVAL_BASE_URL: ${{ vars.EVAL_BASE_URL || '' }}
  EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || '' }}
  EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
  SYSCITY_BASE_URL: ${{ vars.EVAL_BASE_URL || '' }}

jobs:
  eval:
    name: Nightly eval (ci_smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev libasound2-dev libdbus-1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # Minimal feature set: ci_smoke covers core tools only, and skipping
      # vision/browser cuts the cold build roughly in half.
      - name: Build syscity
        run: cargo build --locked --no-default-features --features plugins,sqlite-vec

      - name: Run eval suite
        id: eval
        continue-on-error: true
        env:
          SUITE: ${{ inputs.suite || 'ci_smoke' }}
          TRIALS: ${{ inputs.trials || '0' }}
        run: |
          set -o pipefail
          args=(eval run "$SUITE" --full --collect-badcases --provider "$EVAL_PROVIDER")
          [ -n "$EVAL_MODEL" ] && args+=(--model "$EVAL_MODEL")
          [ -n "$EVAL_JUDGE_MODEL" ] && args+=(--judge-model "$EVAL_JUDGE_MODEL")
          [ -n "$EVAL_BASE_URL" ] && args+=(--base-url "$EVAL_BASE_URL")
          [ -n "$EVAL_API_KEY" ] && args+=(--api-key "$EVAL_API_KEY")
          [ "$TRIALS" != "0" ] && args+=(--trials "$TRIALS")
          ./target/debug/syscity "${args[@]}" 2>&1 | tee eval-output.log

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-${{ github.run_number }}
          path: |
            eval-output.log
            evals/badcases/
            evals/actions/
          if-no-files-found: ignore

      - name: Report failure or recovery
        if: always()
        uses: actions/github-script@v7
        env:
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
          SUITE: ${{ inputs.suite || 'ci_smoke' }}
        with:
          script: |
            const title = `Nightly eval failed: ${process.env.SUITE} (${process.env.EVAL_PROVIDER})`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'eval-nightly',
            });
            const existing = open.find(i => i.title.startsWith('Nightly eval failed'));

            if (process.env.EVAL_OUTCOME === 'failure') {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Still failing on ${new Date().toISOString().slice(0, 10)}: ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title,
                  labels: ['eval-nightly'],
                  body: `The nightly ci_smoke eval suite failed.\n\nRun: ${runUrl}\n\nDownload the run artifacts for eval-output.log and collected badcases.`,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered on ${new Date().toISOString().slice(0, 10)}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
