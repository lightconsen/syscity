version: 2
updates:
  # Rust Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    assignees:
      - "lightconsen"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Frontend (web) dependencies
  #
  # `rebase-strategy: all` because the default does not reach this failure.
  # `pnpm.overrides` in web/package.json and the matching `overrides:` block in
  # the lockfile clash *semantically* and not textually: git merges both sides
  # without complaint, the branch's lockfile ends up without the block, and
  # `pnpm install --frozen-lockfile` then dies with
  # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Nothing reports a conflict, so nothing
  # rebases — the PR just sits red. `all` regenerates the branch whenever the
  # target branch moves, which is what puts the block back. Observed on
  # 2026-10-08 and again 2026-10-14, six days apart.
  #
  # The two npm entries only: a cargo bump edits Cargo.lock as well, so a clash
  # there *is* a textual conflict and the default already rebases on it.
  - package-ecosystem: "npm"
    directory: "/web"
    rebase-strategy: "all"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    assignees:
      - "lightconsen"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Marketing site (site/) dependencies
  # Missing until now, which is why the site lockfile could raise a security
  # alert (alerts scan every manifest in the repo) while never getting an
  # automated bump: version updates only run for the directories listed here.
  - package-ecosystem: "npm"
    directory: "/site"
    rebase-strategy: "all"    # same lockfile-vs-overrides mismatch as /web
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    assignees:
      - "lightconsen"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Desktop (Tauri) dependencies
  - package-ecosystem: "cargo"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "lightconsen"
    labels:
      - "dependencies"
      - "desktop"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "lightconsen"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
