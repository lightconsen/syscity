# Syscity MCP Server Presets
#
# This file defines the MCP server presets shown in the Settings UI.
# You can freely edit this file — add new presets, modify existing ones,
# or remove any you don't need. Changes take effect on the next page refresh.
#
# Format:
#   [preset_name]
#   display_name = "..."    # Human-readable name shown in UI
#   description = "..."     # Short description of what this server does
#   command = "npx"         # Command to run (stdio transport)
#   args = ["..."]          # Command arguments
#   transport = "stdio"     # Transport type: stdio, sse, or streamable_http

[github]
display_name = "GitHub"
description = "Repository management, PRs, issues, code search"
logo_url = "https://cdn.simpleicons.org/github"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
transport = "stdio"

[github.env.GITHUB_PERSONAL_ACCESS_TOKEN]
required = true
description = "GitHub Personal Access Token (repo, read:org scopes)"

[gmail]
display_name = "Gmail"
description = "Read, search and send emails"
logo_url = "https://cdn.simpleicons.org/gmail"
# The previous preset pointed at @modelcontextprotocol/server-gmail, which is
# not a published package (npm 404). This community server is maintained and
# exposes read/search/draft/send tools over the Gmail API.
command = "npx"
args = ["-y", "@gongrzhe/server-gmail-autoauth-mcp"]
transport = "stdio"

[gmail.env.GOOGLE_OAUTH_CLIENT_ID]
required = true
description = "Google OAuth client ID"
[gmail.env.GOOGLE_OAUTH_CLIENT_SECRET]
required = true
description = "Google OAuth client secret"
[gmail.env.GOOGLE_OAUTH_REFRESH_TOKEN]
required = true
description = "Google OAuth refresh token (Gmail API scope)"

[google_calendar]
display_name = "Google Calendar"
description = "Manage calendar events and schedules"
logo_url = "https://cdn.simpleicons.org/googlecalendar"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-google-calendar"]
transport = "stdio"

[google_calendar.env.GOOGLE_OAUTH_CLIENT_ID]
required = true
description = "Google OAuth client ID"
[google_calendar.env.GOOGLE_OAUTH_CLIENT_SECRET]
required = true
description = "Google OAuth client secret"
[google_calendar.env.GOOGLE_OAUTH_REFRESH_TOKEN]
required = true
description = "Google OAuth refresh token (Calendar API scope)"

[google_drive]
display_name = "Google Drive"
description = "Access and manage files in Google Drive"
logo_url = "https://cdn.simpleicons.org/googledrive"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-google-drive"]
transport = "stdio"

[google_drive.env.GOOGLE_OAUTH_CLIENT_ID]
required = true
description = "Google OAuth client ID"
[google_drive.env.GOOGLE_OAUTH_CLIENT_SECRET]
required = true
description = "Google OAuth client secret"
[google_drive.env.GOOGLE_OAUTH_REFRESH_TOKEN]
required = true
description = "Google OAuth refresh token (Drive API scope)"

[notion]
display_name = "Notion"
description = "Read and write Notion pages and databases"
logo_url = "https://cdn.simpleicons.org/notion"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-notion"]
transport = "stdio"

[notion.env.NOTION_TOKEN]
required = true
description = "Notion integration token (internal integration secret)"

[slack]
display_name = "Slack"
description = "Channel messaging, search, and workspace management"
logo_url = "https://a.slack-edge.com/80588/marketing/img/icons/icon_slack_hash_colored.png"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack"]
transport = "stdio"

[slack.env.SLACK_API_TOKEN]
required = true
description = "Slack App Bot User OAuth token (xoxb-...)"
[slack.env.SLACK_DM_PERMISSION]
required = false
description = "Allow DMs to the bot (true/false)"
[slack.env.SLACK_LOG_LEVEL]
required = false
description = "Log level for the Slack server (info/debug)"

[linear]
display_name = "Linear"
description = "Issue tracking, sprint planning, and project management"
logo_url = "https://cdn.simpleicons.org/linear"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-linear"]
transport = "stdio"

[linear.env.LINEAR_API_KEY]
required = true
description = "Linear Personal API key (Settings > Security & access)"

# ── Remote OAuth Presets ──
# These use streamable_http transport with OAuth 2.1 + PKCE.
# The OAuth flow authorizes via your browser automatically.
#
# For remote MCP servers, `url` is the server endpoint and `auth_type`
# must be "oauth2". The OAuth endpoints are discovered automatically
# via /.well-known/oauth-authorization-server.
#
# Local testing: run `python scripts/test_oauth_mcp.py` then enable
# "Test OAuth" in Settings. The mock server simulates the full flow.

[test_oauth]
display_name = "Test OAuth"
description = "Local OAuth test server (run scripts/test_oauth_mcp.py)"
logo_url = "https://cdn.simpleicons.org/testinglibrary"
url = "http://localhost:9999/mcp"
transport = "streamable_http"
auth_type = "oauth2"
client_id = "test-client"
scopes = ""

[notion_remote]
display_name = "Notion (Remote)"
description = "Read and write Notion pages and databases (remote)"
logo_url = "https://cdn.simpleicons.org/notion"
url = "https://mcp.notion.com/mcp"
transport = "streamable_http"
auth_type = "oauth2"
scopes = ""
