# Built-in LLM provider presets.
#
# Each top-level table key is the preset name used in config (e.g. `openai`,
# `kimi`). The `name` field of the resulting `ProviderDefinition` is filled
# from this key automatically — do not repeat it here.
#
# `display_name` and `models` are vendor-level: `models` is the suggested model
# list shown in the pickers and used when a provider has no model list of its
# own. Its **first entry must be the variant's `default_model`** — the two are
# read interchangeably (a provider backfilled from a preset takes the list's
# head as its default), and `preset.rs` has a test that keeps them in step.
#
# Field encodings (serde):
#   protocol              = "open_ai" | "anthropic" | "gemini"
#   auth_method           = "bearer" | "api_key_header" | "google_api_key" | "none"
#   models_endpoint       = list-models path relative to base_url (e.g. "/models"),
#                           or an absolute URL when the list does not live under
#                           the chat base; when omitted it is derived from the
#                           protocol
#   default_stream_family = "OpenAi" | "Anthropic" | "OpenAiReasoning"
#                           | "AnthropicThinking" | "GoogleThinking"
#                           | "OpenRouter" | "Moonshot" | "Minimax" | "Generic"
#
# A vendor may expose multiple protocol endpoints (see `kimi`).

[openai]
display_name = "OpenAI"
# Suggested model IDs, the vendor's default model first (see `default_model`
# below — the first entry and the default must agree).
models = ["gpt-5.4-mini", "gpt-5.5", "gpt-5.4", "gpt-5.4-nano", "gpt-4o"]
[[openai.variants]]
protocol = "open_ai"
default_base_url = "https://api.openai.com/v1"
default_model = "gpt-5.4-mini"
auth_method = "bearer"
models_endpoint = "/models"
default_max_context = 128000
default_supports_vision = true
default_supports_tools = true
default_stream_family = "OpenAi"

[deepseek]
display_name = "DeepSeek"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]
[[deepseek.variants]]
protocol = "open_ai"
default_base_url = "https://api.deepseek.com/v1"
default_model = "deepseek-v4-flash"
auth_method = "bearer"
models_endpoint = "/models"
default_max_context = 128000
default_supports_vision = false
default_supports_tools = true
default_stream_family = "OpenAi"

[ollama]
display_name = "Ollama"
models = ["qwen3", "llama4", "deepseek-r1", "gemma3"]
[[ollama.variants]]
protocol = "open_ai"
default_base_url = "http://localhost:11434/v1"
default_model = "qwen3"
auth_method = "none"
models_endpoint = "/models"
default_max_context = 8192
default_supports_vision = false
default_supports_tools = true
default_stream_family = "OpenAi"

[qwen]
display_name = "Qwen"
models = ["qwen3.7-plus", "qwen3.8-max", "qwen3.7-flash"]
[[qwen.variants]]
protocol = "open_ai"
default_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
default_model = "qwen3.7-plus"
auth_method = "bearer"
models_endpoint = "/models"
default_max_context = 128000
default_supports_vision = true
default_supports_tools = true
default_stream_family = "OpenAi"

# Kimi (Moonshot): supports both OpenAI and Anthropic protocols.
[kimi]
display_name = "Moonshot (Kimi)"
models = ["kimi-k2.6", "kimi-k3", "kimi-k2.7-code", "kimi-k2.7-code-highspeed", "kimi-k2.5"]
[[kimi.variants]]
protocol = "open_ai"
default_base_url = "https://api.moonshot.cn/v1"
default_model = "kimi-k2.6"
auth_method = "bearer"
models_endpoint = "/models"
default_max_context = 128000
default_supports_vision = true
default_supports_tools = true
default_stream_family = "Moonshot"
[[kimi.variants]]
protocol = "anthropic"
default_base_url = "https://api.moonshot.cn/anthropic"
default_model = "kimi-k2.6"
auth_method = "api_key_header"
models_endpoint = "/v1/models"
default_max_context = 128000
default_supports_vision = true
default_supports_tools = true
default_stream_family = "Anthropic"

[anthropic]
display_name = "Anthropic"
models = [
    "claude-sonnet-5",
    "claude-opus-4-6",
    "claude-sonnet-4-6",
    "claude-haiku-4-5-20251001",
    "claude-sonnet-4-20250514",
]
[[anthropic.variants]]
protocol = "anthropic"
default_base_url = "https://api.anthropic.com"
default_model = "claude-sonnet-5"
auth_method = "api_key_header"
models_endpoint = "/v1/models"
default_max_context = 200000
default_supports_vision = true
default_supports_tools = true
default_stream_family = "Anthropic"

[openrouter]
display_name = "OpenRouter"
models = [
    "anthropic/claude-sonnet-5.5",
    "anthropic/claude-opus-5.5",
    "openai/gpt-5.5",
    "google/gemini-3.8-flash",
    "deepseek/deepseek-v4-pro",
    "moonshotai/kimi-k3",
    "z-ai/glm-5.2",
    "qwen/qwen3.8-max-0902",
    "x-ai/grok-4.7",
    "minimax/minimax-m3",
]
[[openrouter.variants]]
protocol = "open_ai"
default_base_url = "https://openrouter.ai/api/v1"
default_model = "anthropic/claude-sonnet-5.5"
auth_method = "bearer"
models_endpoint = "/models"
default_max_context = 1000000
default_supports_vision = true
default_supports_tools = true
# Reasoning arrives in OpenRouter's own delta shape.
default_stream_family = "OpenRouter"
