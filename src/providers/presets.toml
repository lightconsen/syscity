# Built-in LLM provider presets.
#
# Each top-level table key is the preset name used in config (e.g. `openai`,
# `kimi`). The `name` field of the resulting `ProviderDefinition` is filled
# from this key automatically — do not repeat it here.
#
# `display_name` and `models` are vendor-level: `models` is the suggested model
# list shown in the pickers and used when a provider has no model list of its
# own. Its **first entry must be the variant's `default_model`** — the two are
# read interchangeably (a provider backfilled from a preset takes the list's
# head as its default), and `preset.rs` has a test that keeps them in step.
#
# Field encodings (serde):
#   protocol              = "open_ai" | "anthropic" | "gemini"
#   auth_method           = "bearer" | "api_key_header" | "google_api_key" | "none"
#   models_endpoint       = list-models path relative to base_url (e.g. "/models");
#                           when omitted it is derived from the protocol
#   default_stream_family = "OpenAi" | "Anthropic" | "OpenAiReasoning"
#                           | "AnthropicThinking" | "GoogleThinking"
#                           | "OpenRouter" | "Moonshot" | "Minimax" | "Generic"
#
# A vendor may expose multiple protocol endpoints (see `kimi`).

[openai]
display_name = "OpenAI"
# Suggested model IDs, the vendor's default model first (see `default_model`
# below — the first entry and the default must agree).
models = ["gpt-5.4-mini", "gpt-5.5", "gpt-5.4", "gpt-5.4-nano", "gpt-4o"]
[[openai.variants]]
protocol = "open_ai"
default_base_url = "https://api.openai.com/v1"
default_model = "gpt-5.4-mini"
auth_method = "bearer"
models_endpoint = "/models"
default_max_context = 128000
default_supports_vision = true
default_supports_tools = true
default_stream_family = "OpenAi"

