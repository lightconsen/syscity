[package]
name = "syscity-desktop"
version = "0.3.18"
description = "Syscity Desktop App"
authors = ["Syscity Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "process-relaunch-dangerous-allow-symlink-macos"] }
tauri-plugin-shell = "2"
# Desktop self-update via the Tauri updater (minisign-signed bundles).
#
# `zip` is off on purpose. The plugin's default features pull it in for one
# thing: extracting a *zip-shaped* Windows updater bundle (`extract_zip`, in
# `updater.rs`). Our updater payloads are the NSIS `.exe` on Windows, a raw
# `.AppImage` on Linux and the `.app.tar.gz` on macOS (see the manifest built
# in `.github/workflows/release.yml`), so that path is never taken — and the
# zip version it pins (4.x) carries RUSTSEC-2026-0429, where
# `ZipArchive::extract` aborts the process on a symlink entry with a huge
# declared size. Nothing else in the plugin is behind the feature.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
async-trait = "0.1"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.10"

# Desktop builds use syscity's default features plus `cloud` (release
# artifacts ship cloud — matches the CLI release builds' `--all-features`);
# mobile builds use the pruned `mobile` profile (no channels /
# local-embeddings / vision / browser, bundled SQLite, embedded SPA assets);
# Intel macOS (x86_64-apple-darwin) uses the pruned `intel-macos` profile
# (default minus `vision`, plus `cloud`) because ort ships no prebuilt
# library for that target. The dep must live in target tables — cargo
# features are additive, so a shared [dependencies] entry would force default
# features onto every target.
#
# NOTE: target tables can only use *built-in* cfgs — custom aliases like
# syscity's `mobile_os` (emitted by its build.rs) do not exist at dependency
# resolution time and would silently never match. In Rust source the aliases
# apply: `mobile_os`/`desktop_os` in syscity, tauri-build's `mobile` here.
#
# The desktop table must explicitly exclude x86_64-apple-darwin: features
# unify across *all* matching target tables, so if it matched there too, the
# default set (incl. `vision`) would be added back alongside `intel-macos`.
[target.'cfg(not(any(target_os = "android", target_os = "ios", all(target_os = "macos", target_arch = "x86_64"))))'.dependencies]
syscity = { path = "..", features = ["cloud"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
syscity = { path = "..", default-features = false, features = ["intel-macos"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
syscity = { path = "..", default-features = false, features = ["mobile"] }

# JNI, for the one direction the bridge could not do before: the phone pushing
# device events into Rust (`src/events.rs`). Android only — nothing else in this
# crate touches JNI, and desktop builds do not compile it.
#
# Pinned to 0.21 on purpose: `Cargo.lock` already holds jni 0.21.1 (tauri's own
# Android dependency) and 0.22.4 (another chain). This resolves to the 0.21.1
# that is already in the tree, so neither `cargo deny` nor `cargo audit` gains a
# coordinate.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# `link_apple_library` compiles the app's Swift plugin (mobile-ios/) into the
# iOS static library via swift-rs — see build.rs `link_ios_swift`.
tauri-utils = "2"

[lib]
name = "syscity_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "syscity-desktop"
path = "src/main.rs"
