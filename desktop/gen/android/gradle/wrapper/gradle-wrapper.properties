distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# The wrapper's downloader gives up on a read that stalls for its network
# timeout, with no retry. Older wrapper jars hard-coded 10 s; the jar checked
# in beside this file understands this property, and a cold CI runner pulling
# 130 MB from services.gradle.org needs the room. This is what failed the
# Android APK job on 2026-11-08 with `SocketTimeoutException: Read timed out`.
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
