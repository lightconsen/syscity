[package]
name = "base64-tool"
version = "1.0.0"
edition = "2021"
description = "Base64 encode/decode as a Syscity WASM plugin tool"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Its own workspace root: `examples/` is not a member of the repository
# workspace, and cargo refuses a nested crate that neither is a member nor
# declares itself separate.
[workspace]
