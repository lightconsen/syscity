# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check with all features enabled
all-features = true

[advisories]
# A list of advisory IDs to ignore with documented justification
ignore = [
    # `proc-macro-error2` is unmaintained but used by transitive proc-macro crates.
    { id = "RUSTSEC-2026-0173", reason = "transitive unmaintained dependency; no actionable upgrade path" },
    # lopdf 0.34 (via pdf-extract 0.7.12) stack overflow; fixed version needs a major bump no released pdf-extract pulls in yet.
    { id = "RUSTSEC-2026-0187", reason = "transitive via pdf-extract 0.7.12 -> lopdf 0.34; fix requires lopdf >=0.42 major bump" },
    # The three below all flow through ppt-rs 0.2.25's default `pdf-native`
    # feature (pdfrs -> syntect/bincode/yaml-rust, pdfrs -> ttf-parser). We do
    # not use pptx→pdf export, and ppt-rs's default-features=false build is
    # broken upstream (slide_render.rs references pdfrs unconditionally), so
    # the stack cannot be dropped from our side.
    #
    # RUSTSEC-2025-0141 and RUSTSEC-2024-0320 (bincode, yaml-rust) now arrive
    # through a dependency we wrote ourselves as well: `src/tui/ui/highlight.rs`
    # declares syntect directly for code-block highlighting, and syntect's
    # `parsing` feature pulls bincode + yaml-rust. The waiver is unchanged —
    # neither crate has a maintained release — but the reason is no longer
    # only "someone else's features"; it is a compile-time dependency of ours.
    { id = "RUSTSEC-2025-0141", reason = "transitive via ppt-rs 0.2.25 -> pdfrs -> syntect 5.3 -> bincode 1.3.3, and directly via our own syntect dependency (src/tui/ui/highlight.rs) -> syntect parsing -> bincode; upstream team permanently ceased development, no replacement release" },
    { id = "RUSTSEC-2026-0192", reason = "transitive via ppt-rs 0.2.25 -> pdfrs -> ttf-parser; author confirmed unmaintained, no safe upgrade; only reachable via the pptx pdf-export path we do not use" },
    { id = "RUSTSEC-2024-0320", reason = "transitive via ppt-rs 0.2.25 -> pdfrs -> syntect -> yaml-rust 0.4.5, and directly via our own syntect dependency -> syntect parsing -> yaml-rust; unmaintained, no actionable upgrade; not our YAML stack (serde_yml tracked under RUSTSEC-2025-0068)" },
    # `rsa` 0.9 arrives two ways and neither is affected: as jsonwebtoken's RSA
    # backend (its `rust_crypto` feature), and as a dev-dependency that
    # generates a throwaway key inside tests.
    #
    # The advisory names the unfixed part itself: the padding path
    # (RustCrypto/RSA#626 — "padding still not constant-time"), which is the
    # decryption side of PKCS#1 v1.5 and what the Marvin attack targets.
    # Nothing here performs RSA decryption. The key set is public data fetched
    # over the network and every operation against it is a public-key signature
    # verification; the dev-dependency generates a throwaway key locally, with
    # no attacker present.
    #
    # A channel added later may *sign* with a service-account key for outbound
    # OAuth. That is a different code path from unpadding, so the reasoning
    # still holds — but re-read this entry if anything here ever decrypts.
    #
    # This is a waiver rather than a deferred bump because there is nothing to
    # bump to: upstream reports `patched = []` and lists the work as open
    # (RustCrypto/RSA#626, #680, #702), and still affected in 0.10.0-rc.18.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 is only jsonwebtoken's verification backend (public-key ops only — the advisory is private-key timing) plus a test-only key generator; upstream reports patched=[], so no upgrade exists" },
]

[licenses]
# Explicitly allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "0BSD",
    "GPL-3.0",
]
confidence-threshold = 0.8

[bans]
# Warn when multiple versions of the same crate are detected
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Skip duplicate detection for transitive dependency trees that are out of our control.
# These are pulled in by different upstream crates locking different semver ranges.
# Each entry names a crate version that must exist in Cargo.lock; one left behind by
# an upgrade silently stops matching anything, so the list is re-checked on each bump.
skip-tree = [
    # serenity 0.12.5 locks tokio-tungstenite 0.21 -> rustls 0.22 -> rustls-webpki 0.102
    { crate = "serenity@0.12.5", depth = 10 },
    # chromiumoxide pulls in reqwest 0.13 and tungstenite 0.28 alongside our reqwest 0.12 / tungstenite 0.24
    { crate = "chromiumoxide@0.9.1", depth = 10 },
    # config 0.14 uses toml 0.8; other crates pull toml 0.9
    { crate = "config@0.14.1", depth = 5 },
    # wasmtime ecosystem pulls in multiple versions of wasm-encoder, wasmparser, hashbrown, etc.
    { crate = "wasmtime@48.0.5", depth = 10 },
    # dialoguer pulls console 0.16 alongside our console 0.15 (via other deps)
    { crate = "dialoguer@0.11.0", depth = 5 },
    # itertools duplicates from different upstream crates
    { crate = "itertools@0.10.5", depth = 5 },
    # nix duplicates (0.27 via our Cargo.toml, 0.28 via notify)
    { crate = "nix@0.27.1", depth = 5 },
]

[sources]
# Only allow crates.io
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
