<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Syscity — AI Agent System. One agent runtime, every device. AI that controls your computer, local-first, on macOS, Windows, Linux, iOS, and Android."
    />
    <!-- One theme colour, because the page is light-only: a dark-mode phone
         paints this value above the page, and declaring a dark one would put
         a dark bar over a white page. `color-scheme: light` tells the browser
         the same thing, so form controls and scrollbars do not switch. -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <title>Syscity — AI Agent System</title>

    <!-- Canonical: the apex host 301s to www, and the project-pages artifact is
         also reachable under lightconsen.github.io — one URL should own the
         page's search identity. -->
    <link rel="canonical" href="https://www.syscity.net/" />

    <!-- Social preview. Without these a shared link renders as bare text; the
         image is generated by `scripts/make-og-image.mjs`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Syscity" />
    <meta property="og:url" content="https://www.syscity.net/" />
    <meta property="og:title" content="Syscity — AI Agent System" />
    <meta
      property="og:description"
      content="One agent runtime, every device. AI that controls your computer — clicking buttons, browsing the web, running code. Local-first, on macOS, Windows, Linux, iOS and Android."
    />
    <meta property="og:image" content="https://www.syscity.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Syscity — one agent runtime, every device" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Syscity — AI Agent System" />
    <meta
      name="twitter:description"
      content="One agent runtime, every device. AI that controls your computer, local-first, on macOS, Windows, Linux, iOS and Android."
    />
    <meta name="twitter:image" content="https://www.syscity.net/og-image.png" />

    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./site.webmanifest" />
    <style>
      html {
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Cloudflare Web Analytics: cookieless, no fingerprinting, no consent
      banner needed. The token is inserted at build time by
      `scripts/postbuild.mjs` from CFA_ANALYTICS_TOKEN; when that is unset the
      comment is simply removed and no beacon loads. Deliberately not a
      bundler import — it must not become a dependency of the React tree.
    -->
    <!--CFA-BEACON-->
  </body>
</html>
