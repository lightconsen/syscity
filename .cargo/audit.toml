# cargo-audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# Advisory IDs to ignore with documented justification.
# These are all unfixable in the current dependency tree.
ignore = [
    # rsa (RUSTSEC-2023-0071): timing sidechannel in RSA key operations.
    # This is a transitive dependency via sqlx-macros -> sqlx-mysql.
    # Syscity only uses sqlx-sqlite; MySQL support is never enabled at runtime.
    # The rsa crate is pulled in only for sqlx-macros' compile-time macro expansion.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0187: stack overflow in lopdf via deeply nested PDF objects.
    # Transitive via pdf-extract 0.7.12 (which pins lopdf ^0.34); the fixed
    # version needs lopdf >=0.42.0, a major API break no released pdf-extract
    # pulls in yet. Syscity only extracts PDFs on explicit user request.
    "RUSTSEC-2026-0187",
]
