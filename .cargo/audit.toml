# cargo-audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# Advisory IDs to ignore with documented justification.
# These are all unfixable in the current dependency tree.
ignore = [
    # rsa (RUSTSEC-2023-0071): timing sidechannel in RSA key operations.
    # Two paths reach it, and neither is affected at runtime:
    #   - sqlx-macros -> sqlx-mysql: a transitive dependency pulled in only for
    #     compile-time macro expansion. Syscity uses sqlx-sqlite; MySQL support
    #     is never enabled.
    #   - jsonwebtoken -> rsa (its `rust_crypto` feature): the RSA backend for
    #     the Teams / Google Chat bearer-token verifier. The advisory names the
    #     unfixed part itself — the PKCS#1 v1.5 *padding* path
    #     (RustCrypto/RSA#626), i.e. the decryption side, which is what the
    #     Marvin attack targets. This code never decrypts: the key set is
    #     public data and every operation against it is a public-key signature
    #     verification. (A later channel may sign with a service-account key
    #     for outbound OAuth — a different path from unpadding, so the
    #     reasoning holds; re-read if anything here ever decrypts.)
    # Upstream reports patched = [], so there is no version to move to; see the
    # matching entry in deny.toml.
    "RUSTSEC-2023-0071",

    # crypto-bigint (RUSTSEC-2026-0387, 2026-10-23): operations meant to be
    # constant-time could branch on a secret, depending on compiler and target
    # CPU — subtraction, zero counting, division, Montgomery multiplication,
    # and `UintRef` equality.
    #
    # Reached only through `jsonwebtoken` -> `p256` -> `elliptic-curve` ->
    # `crypto-bigint 0.5.5`. The runtime path (the `teams` and `googlechat`
    # channels) only *verifies* inbound bearer tokens: the key set is public
    # data and every operation against it is a signature check on public
    # input. The private-key side (`rsa`) is a dev-dependency used to mint a
    # token against a mock JWKS. So the same reasoning as RUSTSEC-2023-0071
    # applies — nothing here holds a secret the timing could leak.
    #
    # patched = ">= 0.7.6", but nothing in the chain reaches it yet:
    # `jsonwebtoken 11.1.0` is the latest release and still pins
    # `elliptic-curve 0.13` / `p256 0.13`, which are compiled against
    # crypto-bigint 0.5. Drop this waiver once `p256 0.14` lands in
    # jsonwebtoken (or if anything here ever signs with a private key).
    "RUSTSEC-2026-0387",

    # RUSTSEC-2026-0367 / -0368 / -0369 / -0429: four `zip` advisories about
    # **extraction** — SUID/SGID bits preserved, symlink targets outside the
    # destination, permissions applied through symlinks, and an abort on a
    # symlink entry with a huge declared size (all fixed in zip >= 9.0.0).
    #
    # No waiver is needed: the graph now holds exactly one zip, the direct
    # `zip 9` dependency, which is past all four. The 4.6.1 copy that forced
    # the earlier waivers came from `tauri-plugin-updater`'s default `zip`
    # feature, and `desktop/Cargo.toml` now disables default features — that
    # feature only exists for *zip-shaped* Windows updater bundles, which we
    # never publish (ours is the NSIS `.exe`). If an ignore ever reappears
    # here for these IDs, the reason is a second zip copy back in the graph.
]

