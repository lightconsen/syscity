# cargo-audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# Advisory IDs to ignore with documented justification.
# These are all unfixable in the current dependency tree.
ignore = [
    # rsa (RUSTSEC-2023-0071): timing sidechannel in RSA key operations.
    # Two paths reach it, and neither is affected at runtime:
    #   - sqlx-macros -> sqlx-mysql: a transitive dependency pulled in only for
    #     compile-time macro expansion. Syscity uses sqlx-sqlite; MySQL support
    #     is never enabled.
    #   - jsonwebtoken -> rsa (its `rust_crypto` feature): the RSA backend for
    #     the Teams / Google Chat bearer-token verifier. The advisory names the
    #     unfixed part itself — the PKCS#1 v1.5 *padding* path
    #     (RustCrypto/RSA#626), i.e. the decryption side, which is what the
    #     Marvin attack targets. This code never decrypts: the key set is
    #     public data and every operation against it is a public-key signature
    #     verification. (A later channel may sign with a service-account key
    #     for outbound OAuth — a different path from unpadding, so the
    #     reasoning holds; re-read if anything here ever decrypts.)
    # Upstream reports patched = [], so there is no version to move to; see the
    # matching entry in deny.toml.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0367 / -0368 / -0369: three `zip` advisories (2026-10-09/10)
    # about **extraction** — SUID/SGID bits preserved when extracting, symlink
    # targets outside the destination directory, and Unix permissions applied
    # through symlinks. Fixed in zip >= 9.0.0, which four dependents pin below
    # (0.6.6 via ppt-rs, 4.6.1 via tauri-plugin-updater, 8.6.0 via calamine /
    # docx-rs / rust_xlsxwriter, 2.4.2 direct), so there is no single version to
    # move to. Reachability was checked rather than assumed:
    #   - Syscity itself never calls `extract()` anywhere (grepped): the plugin
    #     installer reads entries by index and refuses them with
    #     `enclosed_name()` (zip-slip), the RAG loader reads named entries, and
    #     the catalog tests write archives (`ZipWriter`). The office converters
    #     that used three more zip copies are gone, so the graph now holds two.
    #   - The office crates that carried zip 8.6.0 (calamine, docx-rs,
    #     rust_xlsxwriter) and zip 0.6.6 (ppt-rs) are no longer dependencies.
    #   - tauri-plugin-updater 2.10.1 does — `updater.rs:904`, from
    #     `extract_zip` — but that path is Windows-only and runs only after
    #     `verify_signature()` at `:712`, so reaching it needs a validly signed
    #     update bundle, i.e. the release private key.
    # Re-read this if anything ever extracts an archive that did not come from
    # our own signed release, or if a dependency starts using `extract()` on
    # untrusted input. See the matching entry in deny.toml.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # RUSTSEC-2026-0187: stack overflow in lopdf via deeply nested PDF objects.
    # Transitive via pdf-extract 0.7.12 (which pins lopdf ^0.34); the fixed
    # version needs lopdf >=0.42.0, a major API break no released pdf-extract
    # pulls in yet. Syscity only extracts PDFs on explicit user request.
    "RUSTSEC-2026-0187",
]
