[package]
name = "syscity-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "High-level Rust SDK for building Syscity WASM plugins"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = { version = "0.57", optional = true }

[lib]
crate-type = ["rlib"]

[features]
default = []
# Enable WIT component model bindings for auto-generated host function stubs
wit = ["dep:wit-bindgen"]
